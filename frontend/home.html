<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
<div class="container">

<header>
    <nav>
        <a href="#home">HOME</a> |
        <a href="#menu">MENU</a> |
        <a href="#location">LOCATION</a> |
        <a href="#aboutus">ABOUT US</a> |
        <a href="#contactus">CONTACT US</a>
    </nav>
</header>

<section id="home">
    <img src="banner.jpg">
</section>

<section id="menu">
    <h2>Our Menu</h2>
    <div class="grid-container">
        <img src="menu1.jpg" alt="Menu item 1">
        <img src="menu2.jpg" alt="Menu item 2">
        <img src="menu3.jpg" alt="Menu item 3">
    </div>
</section>

<section id="location">
    <h2>Location</h2>
    <p>38 Patli Gali, Mumbai</p>
</section>

<section id="contactus">
    <h2>Contact Us</h2>
    <p>
        Got questions? Want to place an order?
        Call us at +91791234567 or email us at info@atliqfastfood.com
    </p>
</section>

</div>

<!-- ✅ Dialogflow Messenger Script -->
<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<!-- ✅ Dialogflow Chatbot -->
<df-messenger
  intent="WELCOME"
  chat-title="Mira Food Chatbot"
  agent-id="9cee8104-5556-4084-992c-128396e7e4ac"
  language-code="en">
</df-messenger>

<!-- ✅ Floating Position Style -->
<style>
df-messenger {
  --df-messenger-button-titlebar-color: #ff6b6b;
  --df-messenger-chat-background-color: #fafafa;
  --df-messenger-font-color: black;
  --df-messenger-user-message: #e1ffc7;

  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 999;
}
</style>

</body>
</html>
